services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: urbanflux-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - URBAN_HOST=0.0.0.0
      - URBAN_PORT=8000
      - URBAN_DEBUG=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - urbanflux-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urbanflux-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - urbanflux-network

networks:
  urbanflux-network:
    driver: bridge

